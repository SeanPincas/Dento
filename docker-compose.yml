services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin:
    build:
      context: ./admin/dento
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  backend_uploads:
