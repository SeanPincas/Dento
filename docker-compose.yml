services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin:
    build:
      context: ./admin/dento
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  backend_uploads:
