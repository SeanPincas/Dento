# Development override: live reload for the customer and admin apps.
# Docker Compose loads this file automatically, so plain
#   docker compose up --build
# starts the live-reload setup. For the production-style Nginx build, run
#   docker compose -f docker-compose.yml up --build   (or .\start-dento.ps1)
#
# The customer and admin apps run the Vite dev server against your source
# folders, so saving a file updates the browser automatically. The backend
# runs as usual (restart it after backend code changes).

services:
  frontend:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command:
      - sh
      - -c
      - "npm ci && echo 'Customer app (live reload) - http://localhost:5173' && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "5173:5173"

  admin:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command:
      - sh
      - -c
      - "npm ci && echo 'Admin dashboard (live reload) - http://localhost:5174' && npm run dev -- --host 0.0.0.0 --port 5174 --strictPort"
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_USE_POLLING: "true"
    volumes:
      - ./admin/dento:/app
      - admin_node_modules:/app/node_modules
    ports: !override
      - "5174:5174"

volumes:
  frontend_node_modules:
  admin_node_modules:
